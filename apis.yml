name: AgLocal
description: >-
  AgLocal was a venture-backed food-technology startup (founded 2011 by Mike Hsieh and Naithan Jones,
  Kansas City / San Francisco) that built an online marketplace connecting small family ranchers and
  sustainable meat producers directly with buyers. It launched in 2013 as a ranch-to-restaurant
  marketplace serving chefs, then pivoted in 2014 to a consumer-facing monthly meat subscription
  service. Backed by Andreessen Horowitz (a16z), Chicago Ventures and others across roughly $3.8M in
  funding, the company shut down in 2015, stating it could not reach a self-sustaining business model.
  It is added to the API Evangelist network as an a16z portfolio lead; the company is now defunct and
  its domain (aglocal.com) is parked/for sale, so no live developer portal, API, or specifications
  exist to enrich.
